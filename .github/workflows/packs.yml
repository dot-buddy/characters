name: Packs

# Pull requests: build Dot Buddy, check every pack and load it in the app, check the pull request's own rules
# (one pack, the author's own) with the base branch's copy of the checker, and upload the changed packs' previews.
# main: draw previews for new or changed packs, commit packs/index.json and the README gallery, then publish the site.
# Every Monday: check every pack against the app's latest main, so a change in the app that breaks a pack shows up here
# even when nobody opens a pull request (a failed scheduled run emails the maintainers).
# Every day: count the likes (❤️ or 👍 on each pack's discussion) into packs/index.json and publish the site again.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check packs
    if: github.event_name == 'pull_request' || (github.event_name == 'schedule' && github.event.schedule == '17 3 * * 1')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: doldoldol21/dot-buddy
          path: .app
      - name: Build Dot Buddy
        working-directory: .app
        run: APP="$RUNNER_TEMP/Dot.app" FORCE=1 ./build.sh
      - name: Test the pack rules
        env:
          DOTBUDDY_SRC: .app
        run: python3 -I scripts/test_packs.py
      - name: Take the checker from the base branch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then git show "$BASE:scripts/packs.py" > "$RUNNER_TEMP/packs.py"; else cp scripts/packs.py "$RUNNER_TEMP/packs.py"; fi
      - name: Check
        env:
          DOTBUDDY_SRC: .app
          PACKS_ROOT: ${{ github.workspace }}
        run: python3 "$RUNNER_TEMP/packs.py" check --app .app/bin/DotBuddy
      - name: Pull request rules and previews
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          DOTBUDDY_SRC: .app
          PACKS_ROOT: ${{ github.workspace }}
          BASE: ${{ github.event.pull_request.base.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python3 "$RUNNER_TEMP/packs.py" check-pr --base "$BASE" --author "$AUTHOR" --app .app/bin/DotBuddy --previews "$RUNNER_TEMP/previews"
      - name: Upload previews for review
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: previews
          path: ${{ runner.temp }}/previews
          if-no-files-found: ignore

  publish:
    name: Update the gallery and the site
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '41 4 * * *')
    runs-on: macos-15
    permissions:
      contents: write
      discussions: write
    concurrency: publish
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: doldoldol21/dot-buddy
          path: .app
      - name: Build Dot Buddy
        working-directory: .app
        run: APP="$RUNNER_TEMP/Dot.app" FORCE=1 ./build.sh
      - name: Previews, index and gallery
        env:
          DOTBUDDY_SRC: .app
        run: python3 scripts/packs.py build --app .app/bin/DotBuddy
      - name: Likes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/packs.py likes
      - name: Commit
        run: |
          git add packs README.md
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update previews, index, likes and gallery"
          git push
      - name: Site
        run: python3 scripts/site.py _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish the site
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
